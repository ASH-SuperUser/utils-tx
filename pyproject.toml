[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "utils-tx"
version = "0.1.1"
description = "Threading-safe utility toolkit for trading systems: TCP logging server/client, cron/interval/time job schedulers with overlap protection, and inter-process communication (IPC) list manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "trading",
    "algorithmic-trading",
    "quant",
    "quantitative-finance",
    "automation",
    "logging",
    "tcp-logging-server",
    "log-server",
    "log-client",
    "log-aggregation",
    "scheduler",
    "cron",
    "cron-scheduler",
    "cron-expression",
    "job-scheduler",
    "task-scheduler",
    "frequency-scheduler",
    "time-based-scheduler",
    "overlap-protection",
    "ipc",
    "inter-process-communication",
    "shared-lists",
    "tcp-server",
    "thread-safe",
    "threading",
    "concurrency",
    "monitoring",
    "utilities",
    "trading-utilities",
    "market-data",
    "24-7",
    "reliability",
]

authors = [
    { name = "ASH-SuperUser" },
]

maintainers = [
    { name = "ASH-SuperUser" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

dependencies = [
    "colorama>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/ASH-SuperUser/utils-tx"
Repository = "https://github.com/ASH-SuperUser/utils-tx"
Documentation = "https://github.com/ASH-SuperUser/utils-tx#readme"
Changelog = "https://github.com/ASH-SuperUser/utils-tx/blob/main/CHANGELOG.md"
Issues = "https://github.com/ASH-SuperUser/utils-tx/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["utils_tx*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
